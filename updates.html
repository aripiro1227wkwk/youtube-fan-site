<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>アップデート情報｜YouTubeファンサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: "Meiryo UI", "メイリオ", Meiryo, sans-serif;
      line-height: 1.7;
    }

    .header {
      border-bottom: 3px solid #111111;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .back-button {
      border: 2px solid #111111;
      background: #ffffff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      color: #111111;
    }

    .container {
      width: min(100% - 24px, 800px);
      margin: 0 auto;
      padding: 22px 0 60px;
    }

    .page-title {
      margin: 0 0 22px;
      font-size: 25px;
      font-weight: 700;
    }

    .update-item {
      border: 2px solid #111111;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .update-header {
      background: #c40000;
      color: #ffffff;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .update-date {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .update-version {
      font-size: 12px;
      font-weight: 700;
    }

    .update-body {
      padding: 14px;
    }

    .update-body h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .update-body p {
      margin: 0 0 10px;
    }

    .update-body ul {
      margin: 8px 0 0;
      padding-left: 22px;
    }

    .update-body li {
      margin-bottom: 5px;
    }

    .image-placeholder {
      width: 100%;
      min-height: 160px;
      border: 1px dashed #999999;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #999999;
      margin-top: 12px;
      padding: 15px;
    }

    .footer {
      border-top: 2px solid #111111;
      padding: 20px 12px;
      text-align: center;
      font-size: 12px;
      color: #555555;
    }

    @media (max-width: 520px) {

      .title {
        font-size: 18px;
      }

      .page-title {
        font-size: 22px;
      }

      .update-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

    }
  </style>
</head>

<body>

  <header class="header">

    <div class="title">
      YouTubeファンサイト
    </div>

    <a
      class="back-button"
      href="index.html">

      ← 戻る

    </a>

  </header>


  <main class="container">

    <h1 class="page-title">
      アップデート情報
    </h1>


    <!-- =========================
         最新アップデート
    ========================= -->

    <section class="update-item">

      <div class="update-header">

        <span class="update-date">
          2026/10/09
        </span>

        <span class="update-version">
          Ver. 1.0
        </span>

      </div>


      <div class="update-body">

        <h2>
          YouTubeファンサイト公開準備
        </h2>

        <ul>

          <li>
            サイトの基本ページを作成
          </li>

          <li>
            再生ルールページを追加
          </li>

          <li>
            使い方ページを追加
          </li>

          <li>
            アップデート情報ページを追加
          </li>

        </ul>


        <div class="image-placeholder">
          ここにアップデート画像を追加できます
        </div>

      </div>

    </section>


    <!-- =========================
         次回以降ここに追加
    ========================= -->

    <!--

    <section class="update-item">

      <div class="update-header">

        <span class="update-date">
          YYYY/MM/DD
        </span>

        <span class="update-version">
          Ver. X.X
        </span>

      </div>

      <div class="update-body">

        <h2>
          アップデートタイトル
        </h2>

        <ul>
          <li>変更内容</li>
          <li>追加内容</li>
        </ul>

      </div>

    </section>

    -->


  </main>


  <footer class="footer">

    YouTubeファンサイト

  </footer>

</body>
</html>
