<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>使い方｜YouTubeファンサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: "Meiryo UI", "メイリオ", Meiryo, sans-serif;
      line-height: 1.7;
    }

    .header {
      border-bottom: 3px solid #111111;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .back-button {
      border: 2px solid #111111;
      background: #ffffff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      color: #111111;
    }

    .container {
      width: min(100% - 24px, 800px);
      margin: 0 auto;
      padding: 22px 0 60px;
    }

    .page-title {
      margin: 0 0 22px;
      font-size: 25px;
      font-weight: 700;
    }

    .howto-section {
      border: 2px solid #111111;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .howto-heading {
      margin: 0;
      padding: 13px 14px;
      background: #c40000;
      color: #ffffff;
      font-size: 18px;
    }

    .howto-body {
      padding: 15px;
    }

    .howto-body p {
      margin: 0 0 12px;
    }

    .howto-body p:last-child {
      margin-bottom: 0;
    }

    .image-placeholder {
      width: 100%;
      min-height: 160px;
      border: 1px dashed #999999;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #999999;
      margin: 12px 0;
      padding: 15px;
    }

    .footer {
      border-top: 2px solid #111111;
      padding: 20px 12px;
      text-align: center;
      font-size: 12px;
      color: #555555;
    }

    @media (max-width: 520px) {

      .title {
        font-size: 18px;
      }

      .page-title {
        font-size: 22px;
      }

      .howto-heading {
        font-size: 17px;
      }

    }
  </style>
</head>

<body>

  <header class="header">

    <div class="title">
      YouTubeファンサイト
    </div>

    <a
      class="back-button"
      href="index.html">

      ← 戻る

    </a>

  </header>


  <main class="container">

    <h1 class="page-title">
      使い方
    </h1>


    <!-- 基本の使い方 -->

    <section class="howto-section">

      <h2 class="howto-heading">
        基本の使い方
      </h2>

      <div class="howto-body">

        <p>
          ここにサイトの基本的な使い方を掲載します。
        </p>

        <div class="image-placeholder">
          ここに説明画像を追加できます
        </div>

      </div>

    </section>


    <!-- 今週の動画 -->

    <section class="howto-section">

      <h2 class="howto-heading">
        今週の動画
      </h2>

      <div class="howto-body">

        <p>
          ここに今週の動画ページについての説明を掲載します。
        </p>

        <div class="image-placeholder">
          ここに説明画像を追加できます
        </div>

      </div>

    </section>


    <!-- 再生リスト -->

    <section class="howto-section">

      <h2 class="howto-heading">
        再生リスト
      </h2>

      <div class="howto-body">

        <p>
          ここに再生リストの使い方を掲載します。
        </p>

        <div class="image-placeholder">
          ここに説明画像を追加できます
        </div>

      </div>

    </section>


    <!-- グラフ -->

    <section class="howto-section">

      <h2 class="howto-heading">
        再生数グラフ
      </h2>

      <div class="howto-body">

        <p>
          ここにグラフの見方や使い方を掲載します。
        </p>

        <div class="image-placeholder">
          ここに説明画像を追加できます
        </div>

      </div>

    </section>


    <!-- プッシュ通知 -->

    <section class="howto-section">

      <h2 class="howto-heading">
        プッシュ通知
      </h2>

      <div class="howto-body">

        <p>
          ここにプッシュ通知の設定方法を掲載します。
        </p>

        <div class="image-placeholder">
          ここに説明画像を追加できます
        </div>

      </div>

    </section>


  </main>


  <footer class="footer">

    YouTubeファンサイト

  </footer>

</body>
</html>
